[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-friction-lab"
version = "0.1.0"
description = "Local evidence-based analyzer for Codex engineering friction"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
friction-lab = "friction_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
